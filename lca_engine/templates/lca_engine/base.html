<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tequila LCA Studio Enterprise{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js & Plotly CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-muted-color: #94a3b8;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-purple: #a18cd1;
            --neon-pink: #fbc2eb;
            --neon-green: #43e97b;
        }

        body {
            background-color: var(--bg-main);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar-brand {
            font-weight: 800;
            font-size: 1.15rem;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem;
            margin-bottom: 2rem;
        }

        .sidebar-brand-title {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .sidebar .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.4rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .nav-link i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
            transition: color 0.2s ease;
        }

        .sidebar .nav-link:hover {
            color: #00f2fe;
            background: rgba(6, 182, 212, 0.1);
            transform: translateX(4px);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.4);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        .sidebar .nav-link.active i {
            color: #00f2fe;
        }

        /* Language Toggle */
        .lang-switch {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0f172a;
        }

        /* Main Area */
        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Cards & Components */
        .card {
            background-color: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.12);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .stat-card {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--card-accent, #00f2fe);
            box-shadow: 0 0 10px var(--card-accent, #00f2fe);
        }

        .text-muted {
            color: var(--text-muted-color) !important;
        }

        h2, h3, h5, h6 {
            color: #ffffff !important;
        }

        /* Table overrides */
        .table {
            color: #e2e8f0;
            border-color: var(--border-color);
        }

        .table-dark {
            --bs-table-bg: #1e293b;
            --bs-table-border-color: var(--border-color);
            color: #f8fafc;
        }

        /* Form overrides */
        .form-control, .form-select {
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #06b6d4;
            box-shadow: 0 0 0 0.25rem rgba(6, 182, 212, 0.25);
        }

        .form-range::-webkit-slider-thumb {
            background: #00f2fe;
            box-shadow: 0 0 10px #00f2fe;
        }

        .badge.bg-success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
        <div>
            <a class="sidebar-brand" href="{% url 'dashboard' %}">
                <i class="fa-solid fa-seedling text-info fs-4"></i>
                <span class="sidebar-brand-title">Tequila LCA</span>
            </a>
            
            <nav class="nav flex-column nav-pills mt-4">
                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                    <i class="fa-solid fa-chart-pie"></i> <span data-i18n="nav_dashboard">Dashboard</span>
                </a>
                <a class="nav-link {% if request.resolver_match.url_name == 'inventory_edit' %}active{% endif %}" href="{% url 'inventory_edit' %}">
                    <i class="fa-solid fa-pen-to-square"></i> <span data-i18n="nav_edit_inventory">Edit Inventory</span>
                </a>
                <a class="nav-link {% if request.resolver_match.url_name == 'benchmark' %}active{% endif %}" href="{% url 'benchmark' %}">
                    <i class="fa-solid fa-chart-line"></i> <span data-i18n="nav_benchmark">Class Benchmark</span>
                </a>
                <a class="nav-link" href="{% url 'export_csv' %}">
                    <i class="fa-solid fa-file-arrow-down"></i> <span data-i18n="nav_download_csv">Download CSV</span>
                </a>
            </nav>
        </div>


        <div class="pt-3 border-top border-secondary border-opacity-25">
            <div class="d-flex align-items-center justify-content-between">
                <small class="text-muted fw-semibold">Language / Idioma</small>
                <div class="lang-switch">
                    <button type="button" class="lang-btn active" id="btn-lang-en" onclick="setLanguage('en')">EN</button>
                    <button type="button" class="lang-btn" id="btn-lang-es" onclick="setLanguage('es')">ES</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Internationalization (i18n) JS -->
    <script>
        const i18nDict = {
            en: {
                nav_dashboard: "Dashboard",
                nav_edit_inventory: "Edit Inventory",
                nav_benchmark: "Class Benchmark",
                nav_download_csv: "Download CSV",
                producer: "Producer",
                class: "Class",
                recalculate: "Recalculate",
                functional_unit: "Functional Unit Volume",
                glass_recycling: "Glass Recycling Rate (Slider)",
                climate_footprint: "Climate Footprint (GWP100)",
                water_footprint: "AWARE Water Footprint",
                biogenic_co2: "Biogenic CO2 Emissions",
                background_db: "Background DB Mode",
                hotspot_title: "Interactive Hotspot Breakdown",
                process_flow_title: "Lifecycle Process Flow",
                hotspot_table_title: "Hotspot Contribution Table",
                col_process: "Lifecycle Process / Credit",
                col_gwp: "GWP Impact (kg CO2-eq)",
                col_share: "GWP Share (%)",
                col_water: "AWARE Water Impact (m3 world-eq)",
                col_water_share: "Water Share (%)",
                water_hotspot_title: "Interactive Water Hotspot Breakdown",
                water_process_flow_title: "Water Process Flow",
                water_sensitivity_title: "Water Sensitivity: Impact of Glass Recycling Rate",
                water_sensitivity_subtitle: "Demonstrates how increasing recycled glass content reduces AWARE Water Footprint across classes.",
                benchmark_title: "Tequila Class Comparative Benchmarking",
                benchmark_subtitle: "Side-by-side Environmental Impact Comparison across Tequila Classes for",
                back_dashboard: "← Back to Dashboard",
                gwp_by_class: "Carbon Footprint (GWP100a) by Class",
                water_by_class: "AWARE Water Footprint by Class",
                sensitivity_title: "Carbon Sensitivity: Impact of Glass Recycling Rate",
                sensitivity_subtitle: "Demonstrates how increasing recycled glass content reduces GWP across classes with varying bottle weights.",
                inventory_title: "Inventory Management",
                inventory_subtitle: "Upload a bulk inventory CSV file or edit lifecycle exchanges manually below.",
                csv_upload_title: "Bulk CSV Upload",
                manual_form_title: "Manual Inventory Formset Editor",
                save_recalculate: "Save & Recalculate LCA",
                edit_inventory_btn: "✏️ Edit Inventory",
                class_benchmark_btn: "📊 Class Benchmark",
                export_results_btn: "📥 Export Results",
                control_panel_title: "Scenario Control Panel",
                recalc_required: "⚠️ Recalculation Required",
                upload_process_btn: "Upload & Process CSV"
            },
            es: {
                nav_dashboard: "Panel Principal",
                nav_edit_inventory: "Editar Inventario",
                nav_benchmark: "Comparativa de Clases",
                nav_download_csv: "Descargar CSV",
                producer: "Productor",
                class: "Clase",
                recalculate: "Recalcular",
                functional_unit: "Volumen de Unidad Funcional",
                glass_recycling: "Tasa de Reciclaje de Vidrio (Deslizador)",
                climate_footprint: "Huella de Carbono (GWP100)",
                water_footprint: "Huella Hídrica AWARE",
                biogenic_co2: "Emisiones de CO2 Biogénico",
                background_db: "Modo de Base de Datos",
                hotspot_title: "Desglose Interactivo de Puntos Críticos",
                process_flow_title: "Flujo de Procesos del Ciclo de Vida",
                hotspot_table_title: "Tabla de Contribución por Proceso",
                col_process: "Proceso / Crédito del Ciclo de Vida",
                col_gwp: "Impacto GWP (kg CO2-eq)",
                col_share: "Porcentaje de GWP (%)",
                col_water: "Impacto de Agua AWARE (m3 world-eq)",
                col_water_share: "Porcentaje de Agua (%)",
                water_hotspot_title: "Desglose Interactivo de Agua",
                water_process_flow_title: "Flujo del Proceso de Agua",
                water_sensitivity_title: "Sensibilidad de Agua: Impacto del Reciclaje de Vidrio",
                water_sensitivity_subtitle: "Demuestra cómo aumentar el contenido de vidrio reciclado reduce la Huella Hídrica AWARE en clases.",
                benchmark_title: "Comparativa Ambiental por Clase de Tequila",
                benchmark_subtitle: "Comparación directa de impacto ambiental entre clases de tequila para",
                back_dashboard: "← Volver al Panel",
                gwp_by_class: "Huella de Carbono (GWP100a) por Clase",
                water_by_class: "Huella Hídrica AWARE por Clase",
                sensitivity_title: "Sensibilidad de Carbono: Impacto del Reciclaje de Vidrio",
                sensitivity_subtitle: "Demuestra cómo aumentar el contenido de vidrio reciclado reduce el GWP en clases con distintos pesos de botella.",
                inventory_title: "Gestión de Inventario",
                inventory_subtitle: "Suba un archivo CSV de inventario o edite los intercambios del ciclo de vida manualmente a continuación.",
                csv_upload_title: "Carga Masiva por CSV",
                manual_form_title: "Editor Manual de Formulario de Inventarios",
                save_recalculate: "Guardar y Recalcular ACV",
                edit_inventory_btn: "✏️ Editar Inventario",
                class_benchmark_btn: "📊 Comparativa de Clases",
                export_results_btn: "📥 Exportar Resultados",
                upload_process_btn: "Cargar y Procesar CSV"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem("app_lang", lang);
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (i18nDict[lang] && i18nDict[lang][key]) {
                    el.textContent = i18nDict[lang][key];
                }
            });

            document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
            document.getElementById("btn-lang-es").classList.toggle("active", lang === "es");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedLang = localStorage.getItem("app_lang") || "en";
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
